services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: shahrashena-app:dev
        container_name: shahrashena
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - laravel
        depends_on:
            - mysql
            - redis

    webserver:
        image: nginx:alpine
        container_name: laravel_nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel
        depends_on:
            - app

    vite:
        image: node:20-alpine
        container_name: laravel_vite
        working_dir: /var/www
        volumes:
            - .:/var/www
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - laravel

    mysql:
        image: mysql:8.4
        container_name: laravel_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:alpine
        container_name: laravel_redis
        restart: unless-stopped
        networks:
            - laravel
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: shahrashena-app:dev
        container_name: laravel_queue
        command: php artisan queue:work redis --sleep=3 --tries=3
        volumes:
            - .:/var/www
        networks:
            - laravel
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

networks:
    laravel:
        driver: bridge

volumes:
    mysql_data:
        driver: local
    redis_data:
        driver: local

